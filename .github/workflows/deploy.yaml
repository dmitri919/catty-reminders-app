name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Prepare image name
        id: prep
        run: |
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.space
          username: dmitri
          port: 3173
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            
            cd /home/dmitri/app/catty-reminders-app

            export COMPOSE_PROJECT_NAME=catty-reminders-app
            export IMAGE="${{ steps.prep.outputs.image }}:${{ github.sha }}"
            export MARIADB_ROOT_PASSWORD=mypass
            export MARIADB_DATABASE=catty_reminders
            export MARIADB_USER=root
            export MARIADB_PASSWORD=mypass

            docker compose up -d --pull always --remove-orphans
